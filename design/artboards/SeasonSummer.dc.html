<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ثيم الصيف — الأكواخ السويسرية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0B2A2C}
a{color:#FFFFFF}a:hover{color:#BFF3EA}
.ph-night{background-image:url(/_blob/64b0925a9a45bbf1651db9a30fd41526);background-size:cover;background-position:center 75%}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-60px)}}
.caustic{animation:drift 8s ease-in-out infinite alternate}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-260px);opacity:0}}
.bubble{animation:rise 7s linear infinite}
@media (prefers-reduced-motion: reduce){.caustic,.bubble{animation:none}}
</style>
</helmet>
<div dir="rtl" class="ph-night" style="width: 1440px; height: 820px; position: relative; overflow: hidden; font-family: 'IBM Plex Sans Arabic', sans-serif">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(120,230,215,0.22) 0%, rgba(20,120,130,0.1) 50%, rgba(10,60,70,0.4) 100%)"></div>
<svg class="caustic" aria-hidden="true" width="1560" height="820" viewBox="0 0 1560 820" style="position: absolute; top: 0; left: 0; opacity: 0.35; mix-blend-mode: screen">
<g fill="none" stroke="#CFFFF6" stroke-width="2" stroke-linecap="round">
<path d="M0 520 Q60 480 120 520 T240 520 T360 520 T480 520 T600 520 T720 520 T840 520 T960 520 T1080 520 T1200 520 T1320 520 T1440 520 T1560 520"/>
<path d="M0 580 Q80 540 160 585 T320 580 T480 590 T640 575 T800 585 T960 578 T1120 588 T1280 576 T1440 586 T1560 580" stroke-width="1.5"/>
<path d="M0 650 Q70 615 140 655 T280 650 T420 660 T560 645 T700 655 T840 648 T980 658 T1120 646 T1260 656 T1400 648 T1560 652" stroke-width="2.5"/>
<path d="M0 720 Q90 690 180 725 T360 720 T540 730 T720 715 T900 725 T1080 718 T1260 728 T1440 716 T1560 722" stroke-width="1.5"/>
</g>
</svg>
<div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6,40,44,0) 0%, rgba(6,40,44,0.3) 50%, rgba(6,40,44,0.8) 100%)"></div>
<div aria-hidden="true" style="position: absolute; inset: 0">
<sc-for list="{{ bubbles }}" as="b" hint-placeholder-count="14">
<span class="bubble" style="position: absolute; left: {{ b.x }}px; top: {{ b.y }}px; width: {{ b.s }}px; height: {{ b.s }}px; border-radius: 999px; border: 1.5px solid rgba(220,255,250,0.8); background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.7), rgba(255,255,255,0.05) 60%); animation-delay: {{ b.d }}s"></span>
</sc-for>
</div>

<header style="position: absolute; top: 24px; right: 120px; left: 120px; height: 72px; box-sizing: border-box; padding: 0 14px 0 22px; border-radius: 20px; background: rgba(230,255,251,0.22); backdrop-filter: blur(20px); border: 1px solid rgba(220,255,250,0.5); display: flex; align-items: center; justify-content: space-between; color: #FFFFFF">
<span style="display: flex; align-items: center; gap: 10px"><svg width="36" height="36" viewBox="0 0 40 40" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 30 L20 6 L35 30"/><path d="M20 14 L14 25 H26Z" stroke="#BFF3EA"/><path d="M20 25 V29"/><path d="M6 35 Q10 32 14 35 T22 35 T30 35 T36 35" stroke="#7FE3D6"/></svg><span style="font-family: Alexandria, sans-serif; font-weight: 700; font-size: 18px">الأكواخ السويسرية</span></span>
<span style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.18); font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>ثيم الصيف</span>
</header>

<div style="position: absolute; right: 120px; top: 220px; max-width: 560px; display: flex; flex-direction: column; gap: 20px; color: #FFFFFF">
<span style="align-self: flex-start; padding: 8px 14px; border-radius: 999px; background: rgba(127,227,214,0.2); border: 1px solid rgba(191,243,234,0.6); backdrop-filter: blur(8px); font-size: 14px; font-weight: 600; color: #DFFFF9">صيف منعش · مسبحك الخاص</span>
<h1 style="margin: 0; font-family: Alexandria, sans-serif; font-weight: 700; font-size: 66px; line-height: 1.18; text-shadow: 0 2px 30px rgba(0,0,0,0.3)">انتعاش الصيف،<br>بمسبحك الخاص</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.85; color: #E6FBF8">ماء بارد وانعكاسات ضوء ونسمة مسائية. احجز فترة 6 أو 10 ساعات أو يومًا كاملًا.</p>
<a href="#" style="align-self: flex-start; height: 60px; padding: 0 28px; border-radius: 999px; background: linear-gradient(90deg, #26B3A3 0%, #1D7F86 50%, #145A5E 100%); color: #FFFFFF; text-decoration: none; font-family: Alexandria, sans-serif; font-weight: 600; font-size: 17px; display: flex; align-items: center; gap: 12px; box-shadow: 0 16px 36px rgba(38,179,163,.45)">احجز يومك الصيفي</a>
</div>

<div style="position: absolute; left: 120px; bottom: 48px; padding: 16px 20px; border-radius: 20px; background: rgba(230,255,251,0.2); backdrop-filter: blur(18px); border: 1px solid rgba(220,255,250,0.45); color: #FFFFFF; display: flex; flex-direction: column; gap: 6px; max-width: 330px">
<span style="font-family: Alexandria, sans-serif; font-weight: 600; font-size: 15px">طبقة الثيم</span>
<span style="font-size: 13px; line-height: 1.7; color: #E6FBF8">انعكاسات ماء تتحرك ببطء، فقاعات صاعدة، ولون فيروزي منعش بدل النحاسي في الأزرار.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
renderVals() {
var seed = 11;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
var bubbles = [];
for (var i = 0; i < 16; i++) {
bubbles.push({ x: Math.round(rnd() * 1400), y: 560 + Math.round(rnd() * 240), s: 6 + Math.round(rnd() * 14), d: (rnd() * 7).toFixed(1) });
}
return { bubbles: bubbles };
}
}
</script>
</body>
</html>
